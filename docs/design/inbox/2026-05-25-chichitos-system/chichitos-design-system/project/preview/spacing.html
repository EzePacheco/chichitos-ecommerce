<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--cream-50);font-family:var(--font-sans);}
.row{display:flex;align-items:flex-end;gap:14px;}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{background:var(--coral);width:42px;border-radius:6px;}
.label{font-size:10px;color:var(--ink-500);font-family:ui-monospace,monospace;}
.name{font-size:11px;color:var(--ink-900);font-weight:600;}
</style></head><body>
<div class="row">
  <div class="col"><div class="bar" style="height:4px"></div><span class="name">1</span><span class="label">4px</span></div>
  <div class="col"><div class="bar" style="height:8px"></div><span class="name">2</span><span class="label">8px</span></div>
  <div class="col"><div class="bar" style="height:12px"></div><span class="name">3</span><span class="label">12px</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="name">4</span><span class="label">16px</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="name">6</span><span class="label">24px</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="name">8</span><span class="label">32px</span></div>
  <div class="col"><div class="bar" style="height:48px"></div><span class="name">12</span><span class="label">48px</span></div>
  <div class="col"><div class="bar" style="height:64px"></div><span class="name">16</span><span class="label">64px</span></div>
  <div class="col"><div class="bar" style="height:80px"></div><span class="name">20</span><span class="label">80px</span></div>
</div>
</body></html>
