<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--cream-50);font-family:var(--font-sans);}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:18px;}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-900);font-size:10px;text-align:center;}
.ic svg{stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
</style></head><body>
<div class="row">
  <div class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>bag</div>
  <div class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.65-7 10-7 10z"/></svg>heart</div>
  <div class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>search</div>

  <div class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><rect x="1" y="6" width="14" height="11"/><polygon points="15 9 19 9 22 13 22 17 15 17 15 9"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>truck</div>
  <div class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M21 8.5V17a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 17V8.5"/><path d="M3.3 7.6L12 12l8.7-4.4"/><path d="M12 12v10"/></svg>package</div>
  <div class="ic"><svg viewBox="0 0 24 24" width="24" height="24"><rect x="2" y="6" width="20" height="13" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>card</div>
</div>

</body></html>
