<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--cream-50);}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.item{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);display:flex;align-items:center;gap:10px;font-size:12px;font-family:var(--font-sans);}
.dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;}
.label{font-weight:600;color:var(--ink-900);}
.token{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-500);}
</style></head><body>
<div class="row">
  <div class="item"><div class="dot" style="background:#F7EFE0;border:1px solid #C9B193;"></div><div><div class="label">bg</div><div class="token">cream-100</div></div></div>
  <div class="item"><div class="dot" style="background:#1F1A14;"></div><div><div class="label">fg</div><div class="token">ink-900</div></div></div>
  <div class="item"><div class="dot" style="background:#E08868;"></div><div><div class="label">accent</div><div class="token">coral</div></div></div>
  <div class="item"><div class="dot" style="background:#7DA9C9;"></div><div><div class="label">link</div><div class="token">celeste-d</div></div></div>
  <div class="item"><div class="dot" style="background:#7E9A6E;"></div><div><div class="label">success</div><div class="token">salvia-d</div></div></div>
  <div class="item"><div class="dot" style="background:#C28E2E;"></div><div><div class="label">warning</div><div class="token">mostaza-d</div></div></div>
  <div class="item"><div class="dot" style="background:#B84A35;"></div><div><div class="label">danger</div><div class="token">#B84A35</div></div></div>
  <div class="item"><div class="dot" style="background:#1FAD5B;"></div><div><div class="label">whatsapp</div><div class="token">#1FAD5B</div></div></div>
  <div class="item"><div class="dot" style="background:#FFFDF7;border:1px solid #E6D9C2;"></div><div><div class="label">surface</div><div class="token">cream-light</div></div></div>
</div>
</body></html>
