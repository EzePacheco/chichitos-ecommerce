<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:var(--cream-50);}
.script{font-family:var(--font-script);font-weight:600;font-size:54px;color:var(--coral-d);line-height:1;transform:rotate(-3deg);display:inline-block;}
.row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:8px;}
.s{font-family:var(--font-script);color:var(--ink-900);}
.meta{font-family:var(--font-sans);font-size:11px;color:var(--ink-500);margin-top:14px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;}
</style></head><body>
<span class="script">¡nuevo!</span>
<div class="row">
  <span class="s" style="font-size:28px;color:var(--coral-d)">a pedido</span>
  <span class="s" style="font-size:24px;color:var(--salvia-d)">hecho a mano</span>
  <span class="s" style="font-size:20px;color:var(--celeste-d)">con amor</span>
</div>
<div class="meta">Caveat · guiños hand-lettered, no para texto largo</div>
</body></html>
