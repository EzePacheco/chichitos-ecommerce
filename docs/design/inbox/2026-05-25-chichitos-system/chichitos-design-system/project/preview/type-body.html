<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--cream-50);font-family:var(--font-sans);color:var(--ink-900);}
.lg{font-size:24px;font-weight:600;}
.md{font-size:16px;font-weight:400;color:var(--ink-700);margin-top:4px;line-height:1.5;}
.sm{font-size:13px;color:var(--ink-500);margin-top:8px;}
.weights{display:flex;gap:14px;margin-top:14px;font-size:14px;align-items:baseline;color:var(--ink-700);}
.weights span{padding:2px 0;}
.meta{font-family:var(--font-sans);font-size:11px;color:var(--ink-500);margin-top:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;}
</style></head><body>
<div class="lg">Algodón peinado, suave al tacto</div>
<div class="md">Producción a pedido en nuestro taller. Cada prenda se imprime cuando llega tu pedido.</div>
<div class="weights">
  <span style="font-weight:300">Light</span>
  <span style="font-weight:400">Regular</span>
  <span style="font-weight:500">Medium</span>
  <span style="font-weight:600">Semibold</span>
  <span style="font-weight:700">Bold</span>
</div>
<div class="meta">Outfit · cuerpo + UI</div>
</body></html>
