<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:var(--cream-50);}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.tile{aspect-ratio:1.4/1;background:var(--surface);border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-sans);font-size:11px;color:var(--ink-700);}
.tile .name{font-weight:600;color:var(--ink-900);}
.tile .v{font-family:ui-monospace,monospace;font-size:9px;color:var(--ink-500);}
</style></head><body>
<div class="row">
  <div class="tile" style="box-shadow:0 1px 2px rgba(63,47,28,.06)"><span class="name">sh-xs</span><span class="v">divisor</span></div>
  <div class="tile" style="box-shadow:0 2px 6px rgba(63,47,28,.06),0 1px 2px rgba(63,47,28,.04)"><span class="name">sh-sm</span><span class="v">card reposo</span></div>
  <div class="tile" style="box-shadow:0 8px 18px -8px rgba(63,47,28,.16),0 2px 4px rgba(63,47,28,.06)"><span class="name">sh-md</span><span class="v">hover</span></div>
  <div class="tile" style="box-shadow:0 24px 40px -16px rgba(63,47,28,.18),0 4px 10px rgba(63,47,28,.06)"><span class="name">sh-lg</span><span class="v">overlays</span></div>
  <div class="tile" style="box-shadow:0 0 0 3px rgba(224,136,104,.35);border:1px solid var(--coral)"><span class="name">sh-focus</span><span class="v">accesible</span></div>
</div>
</body></html>
