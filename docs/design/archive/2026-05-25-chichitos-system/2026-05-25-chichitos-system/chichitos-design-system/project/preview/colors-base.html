<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--cream-50);}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{aspect-ratio:1.4/1;border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);font-family:var(--font-sans);font-size:11px;font-weight:500;}
.sw .hex{font-family:ui-monospace,monospace;font-size:10px;opacity:.6;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#FCF7EC;color:#1F1A14;"><span>cream-50</span><span class="hex">#FCF7EC</span></div>
  <div class="sw" style="background:#F7EFE0;color:#1F1A14;"><span>cream-100</span><span class="hex">#F7EFE0</span></div>
  <div class="sw" style="background:#EFE3CE;color:#1F1A14;"><span>cream-200</span><span class="hex">#EFE3CE</span></div>
  <div class="sw" style="background:#E4D2B5;color:#1F1A14;"><span>cream-300</span><span class="hex">#E4D2B5</span></div>
  <div class="sw" style="background:#C9B193;color:#1F1A14;"><span>sand-400</span><span class="hex">#C9B193</span></div>
  <div class="sw" style="background:#1F1A14;color:#FCF7EC;"><span>ink-900</span><span class="hex">#1F1A14</span></div>
  <div class="sw" style="background:#3A312A;color:#FCF7EC;"><span>ink-700</span><span class="hex">#3A312A</span></div>
  <div class="sw" style="background:#6B5E52;color:#FCF7EC;"><span>ink-500</span><span class="hex">#6B5E52</span></div>
  <div class="sw" style="background:#9C8D7E;color:#FCF7EC;"><span>ink-300</span><span class="hex">#9C8D7E</span></div>
  <div class="sw" style="background:#FFFDF7;color:#1F1A14;border:1px dashed #C9B193;"><span>surface</span><span class="hex">#FFFDF7</span></div>
</div>
</body></html>
