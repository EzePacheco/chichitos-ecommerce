<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--cream-50);}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{aspect-ratio:1.4/1;border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-sans);font-size:11px;font-weight:600;color:#1F1A14;}
.sw .hex{font-family:ui-monospace,monospace;font-size:10px;opacity:.7;font-weight:400;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#F5C9A8;"><span>durazno</span><span class="hex">#F5C9A8</span></div>
  <div class="sw" style="background:#B4C9A4;"><span>salvia</span><span class="hex">#B4C9A4</span></div>
  <div class="sw" style="background:#B7D2E6;"><span>celeste</span><span class="hex">#B7D2E6</span></div>
  <div class="sw" style="background:#E08868;color:white;"><span>coral</span><span class="hex">#E08868</span></div>
  <div class="sw" style="background:#E4B254;"><span>mostaza</span><span class="hex">#E4B254</span></div>
  <div class="sw" style="background:#E89F76;color:white;"><span>durazno-d</span><span class="hex">#E89F76</span></div>
  <div class="sw" style="background:#7E9A6E;color:white;"><span>salvia-d</span><span class="hex">#7E9A6E</span></div>
  <div class="sw" style="background:#7DA9C9;color:white;"><span>celeste-d</span><span class="hex">#7DA9C9</span></div>
  <div class="sw" style="background:#C56A4E;color:white;"><span>coral-d</span><span class="hex">#C56A4E</span></div>
  <div class="sw" style="background:#F2B9B9;"><span>rosa</span><span class="hex">#F2B9B9</span></div>
</div>
</body></html>
