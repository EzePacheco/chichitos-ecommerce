<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--cream-50);}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.tile{aspect-ratio:1.5/1;background:var(--ink-900);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-sans);font-size:11px;color:var(--cream-50);}
.tile .name{font-weight:600;}
.tile .v{font-family:ui-monospace,monospace;font-size:10px;opacity:.7;}
</style></head><body>
<div class="row">
  <div class="tile" style="border-radius:6px"><span class="name">r-xs</span><span class="v">6px</span></div>
  <div class="tile" style="border-radius:10px"><span class="name">r-sm</span><span class="v">10px</span></div>
  <div class="tile" style="border-radius:14px"><span class="name">r-md</span><span class="v">14px</span></div>
  <div class="tile" style="border-radius:20px"><span class="name">r-lg</span><span class="v">20px</span></div>
  <div class="tile" style="border-radius:28px"><span class="name">r-xl</span><span class="v">28px</span></div>
  <div class="tile" style="border-radius:40px"><span class="name">r-2xl</span><span class="v">40px</span></div>
  <div class="tile" style="border-radius:999px"><span class="name">r-pill</span><span class="v">999px</span></div>
  <div class="tile" style="border-radius:62% 38% 55% 45% / 50% 60% 40% 50%;background:var(--coral)"><span class="name">r-blob</span><span class="v">orgánico</span></div>
</div>
</body></html>
