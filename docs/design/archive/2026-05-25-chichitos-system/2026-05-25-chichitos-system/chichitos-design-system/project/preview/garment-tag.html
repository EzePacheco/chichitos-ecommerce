<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--cream-50);}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:13px;font-weight:500;border-radius:var(--r-pill);font-family:var(--font-sans);}
.chip--dashed{border:1px dashed var(--sand-400);background:var(--cream-50);color:var(--ink-700);}
.chip--solid{border:1px solid var(--line);background:var(--cream-50);color:var(--ink-700);}
.chip--active{background:var(--ink-900);color:var(--cream-50);}
.chip--durazno{background:var(--durazno);color:var(--ink-900);}
.chip--salvia{background:var(--salvia);color:var(--ink-900);}
.chip--celeste{background:var(--celeste);color:var(--ink-900);}
.chip--mostaza{background:var(--mostaza);color:var(--ink-900);}
</style></head><body>
<div class="row">
  <span class="chip chip--dashed">Hecho en taller</span>
  <span class="chip chip--solid">Talle 6</span>
  <span class="chip chip--active">Talle 8</span>
  <span class="chip chip--salvia">Más vendida</span>
  <span class="chip chip--mostaza">Nuevo</span>
  <span class="chip chip--durazno">Regalo</span>
  <span class="chip chip--celeste">DTF</span>
</div>
</body></html>
