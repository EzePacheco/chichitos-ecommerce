<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--cream-50);}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:12px;font-weight:500;color:var(--ink-700);}
</style></head><body>
<div class="row">
  <div class="field"><label>Nombre</label><input class="input" placeholder="Tu nombre" value="Camila"></div>
  <div class="field"><label>Email</label><input class="input" placeholder="vos@correo.com"></div>
  <div class="field"><label>Talle</label>
    <select class="select"><option>Talle 4</option><option>Talle 6</option></select>
  </div>
  <div class="field"><label>Mensaje</label><input class="input" placeholder="Algo más..."></div>
</div>
</body></html>
